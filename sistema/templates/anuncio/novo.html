{% extends base_html %}
{% load static %}
{% block titulo %} Adição de anúncio {% endblock %}


{% block conteudo %}
<div class="d-flex align-items-center py-4">
    <main class="w-100 m-auto formulario">
        <form action="/anuncio/novo/" method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <h1 class="h3 mb-3 fw-normal text-center">Cadastre um novo anúncio</h1>
            
            <div class="mb-3">
                <label  class="form-label">Titulo do anuncio</label>
                {{ form.titulo }}
            </div>

            <div class="mb-3">
                <label  class="form-label">Valor da diária</label>
                {{ form.diaria }}
            </div>

            <div class="mb-3">
                <label  class="form-label">Veiculo</label>
                {{ form.veiculo }}
            </div>

            <div class="mb-3">
                <label  class="form-label">Descrição do anuncio</label>
                {{ form.descricao }}
            </div>

           
            <button class="btn btn-primary w-100 py-2" type="submit">Cadastrar Anúncio</button>
        </form>
    </main>
</div>
{% endblock %}
