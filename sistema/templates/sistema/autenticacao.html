{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <link rel="stylesheet" href="{% static 'css/bootstrap/bootstrap.css' %}">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <script src="{% static 'js/bootstrap/bootstrap.js' %}"></script>
    <script src="{% static 'js/script.js' %}"></script>
</head>
<body class="d-flex align-items-center py-4 ">
    
    <main class="w-100 m-auto formulario">
        
        <div class="d-flex align-items-center justify-content-center gap-3 mb-4">
            <img src="{% static 'img/download.png' %}" height="50" width="50" alt="Logo">
            <h3 class="mb-0">Aluguel de Carros</h3>
        </div>

        <form action="/" method="post">
            {% csrf_token %}
            <h1 class="h3 mb-3 fw-normal">Faça o Login</h1>
            <div class="form-floating">
                <input type="mail" name="usuario" class="form-control" id="floatingInput"placeholder="email"/>
                <label for="floatingInput">E-mail</label>
            </div>
            <div class="form-floating">
                <input type="password"  name="senha" class="form-control" id="floatingInput"placeholder="senha"/>
                <label for="floatingInput">Senha</label>
            </div>
            <div class="form-check text-start my-3">
                <input type="checkbox" class="form-check-input" id="flexCheckDefault"/>
                <label class="form-check-label" for="flexCheckDefault">Salvar</label>
            </div>
            <button class="btn btn-primary w-100 py-2">Entrar</button>
        </form>
    </main>
    
    
</body>
</html>
