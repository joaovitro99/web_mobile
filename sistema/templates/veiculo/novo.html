{% extends base_html %}
{% load static %}
{% block titulo %} Adição de veiculos {% endblock %}


{% block conteudo %}
<div class="d-flex align-items-center py-4">
    <main class="w-100 m-auto formulario">
        <form action="/veiculo/novo/" method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <h1 class="h3 mb-3 fw-normal text-center">Cadastre um novo veículo</h1>
            
            <div class="mb-3">
                <label  class="form-label">Marca</label>
                {{ form.marca }}
            </div>

            <div class="mb-3">
                <label  class="form-label">Modelo</label>
                {{ form.modelo }}
            </div>

            <div class="mb-3">
                <label  class="form-label">Ano</label>
                {{ form.ano }}
            </div>

            <div class="mb-3">
                <label  class="form-label">Cor</label>
                {{ form.cor }}
            </div>

            <div class="mb-3">
                <label  class="form-label">Combustível</label>
                {{ form.combustivel }}
            </div>

            <div class="mb-3">
                <label  class="form-label">Imagem</label>
                {{ form.foto }}
            </div>

            <button class="btn btn-primary w-100 py-2" type="submit">Cadastrar Veículo</button>
        </form>
    </main>
</div>
{% endblock %}
